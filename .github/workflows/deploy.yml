name: Deploy Directory Listing

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Index Page
        run: |
          python3 - << 'EOF'
          import os
          import html

          html_output = """<!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>PDF Archive</title>
            <script src="https://cdn.tailwindcss.com"></script>
          </head>
          <body class="bg-slate-50 p-6 sm:p-12 text-slate-800">
            <div class="max-w-4xl mx-auto space-y-6">
              <h1 class="text-3xl font-bold text-slate-900 mb-6">PDF Archive</h1>
          """

          found_any = False
          for root, dirs, files in sorted(os.walk('.')):
              # Skip hidden dirs like .git and .github
              dirs[:] = [d for d in dirs if not d.startswith('.')]
              pdfs = sorted([f for f in files if f.lower().endswith('.pdf')])
              
              if not pdfs:
                  continue
              
              found_any = True
              rel_dir = os.path.relpath(root, '.')
              folder_title = "Root Directory" if rel_dir == '.' else rel_dir

              html_output += f"""
              <div class="bg-white rounded-lg border border-slate-200 shadow-sm overflow-hidden">
                <div class="bg-slate-100 px-4 py-2 border-b border-slate-200 font-semibold text-slate-700 text-sm">
                  📁 {html.escape(folder_title)}
                </div>
                <ul class="divide-y divide-slate-100">
              """
              
              for pdf in pdfs:
                  file_path = os.path.join(rel_dir, pdf) if rel_dir != '.' else pdf
                  file_url = os.path.normpath(file_path).replace("\\", "/")
                  clean_name = os.path.splitext(pdf)[0].replace('_', ' ').replace('-', ' ')

                  html_output += f"""
                  <li class="px-4 py-3 flex items-center justify-between hover:bg-slate-50 text-sm">
                    <span class="truncate mr-4 text-slate-700 capitalize">{html.escape(clean_name)}</span>
                    <a href="{html.escape(file_url)}" target="_blank" class="px-3 py-1 bg-slate-100 hover:bg-slate-200 rounded text-xs font-medium text-slate-600">Open</a>
                  </li>
                  """
              html_output += "</ul></div>"

          if not found_any:
              html_output += "<p class='text-slate-500'>No PDF files found in repository.</p>"

          html_output += "</div></body></html>"

          with open("index.html", "w", encoding="utf-8") as f:
              f.write(html_output)
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
