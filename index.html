<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Config Metadata -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
  <!-- Headers -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="Content-Security-Policy" content="">
  <!-- The following replaces frame-ancestors 'self', which is unsupported in meta tags. -->
  <script>
    if (self !== top) {
      top.location = self.location;
    }
  </script>  

  <!-- Title Metadata -->
  <title>Qumulo White Papers</title>
  <meta name="twitter:title" content="Qumulo White Papers">
  <meta property="og:title" content="Qumulo White Papers">

  <!-- Description Metadata -->
  <meta name="description" content="This repository contains the best practices, technical white papers, and architecture white papers for Qumulo.">
  <meta name="twitter:description" content="This repository contains the best practices, technical white papers, and architecture white papers for Qumulo.">
  <meta property="og:description" content="This repository contains the most up-to-date best practices, technical white papers, and architecture white papers for Qumulo.">

  <!-- URL Metadata-->
  <link rel="canonical" href="https://white-papers.qumulo.com/">
  <meta name="twitter:url" content="https://white-papers.qumulo.com/">
  <meta property="og:url" content="https://white-papers.qumulo.com/">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:domain" content="qumulo.com">
  <meta name="twitter:site" content="@Qumulo">
  <meta name="twitter:creator" content="@Qumulo">
  <meta name="twitter:image" content="https://white-papers.qumulo.com/images/qumulo-white-papers-630px.png">

  <!-- OpenGraph Card -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Qumulo">
  <meta property="og:image" content="https://white-papers.qumulo.com/images/qumulo-white-papers-630px.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:logo" content="https://white-papers.qumulo.com/images/qumulo-white-papers-630px.png">

  <!-- Define Favicon Variants -->
  <link rel="apple-touch-icon" sizes="180x180" href="{{ "images/apple-touch-icon.png" | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ "images/favicon-32x32.png" | relative_url }}">
  <link rel="icon" type="image/png" sizes="194x194" href="{{ "images/favicon-194x194.png" | relative_url }}">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ "images/android-chrome-192x192.png" | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ "images/favicon-16x16.png" | relative_url }}">
  <link rel="manifest" href="{{ "images/site.webmanifest" | relative_url }}">
  <link rel="mask-icon" href="{{ "images/safari-pinned-tab.svg" | relative_url }}" color="#5bbad5">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" type="text/css" href="css/styles.css">

  <!-- Load Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-PRC1WZMZME"></script>  
  <script defer src="/js/googletag.js"></script>

  <!-- Load PDF Files from Repository -->
  <script defer src="js/list-files.js"></script>  
</head>
<body>
  <header id="header">
    <div id="title-bar">
      <a href="https://www.qumulo.com/" target="_blank">
        <img src="images/qumulo-logo-on-dark.svg" alt="Qumulo Logo" class="logo">
      </a>
    </div>
  </header>
  
  <main id="content">
    <h1>Qumulo White Papers</h1>
    <p>This repository contains the best practices, technical white papers, and architecture white papers for Qumulo.</p>
    <div id="file-list">
      <p class="status-msg">Loading documents&hellip;</p>
    </div>
  </main>

  <footer>
    <div id="footer">
      <img src="images/grumpquats.png" alt="Three Grumpquats" class="grumpquats">
    </div>
  </footer>
</body>
</html>
